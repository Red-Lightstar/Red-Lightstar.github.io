<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>意见反馈</title>
    <style>
        /* ===== 全局重置 & 暗色主题 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== 顶部导航 ===== */
        #header {
            width: 100%;
            max-width: 560px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        #title {
            color: #4ade80;
            font-size: 20px;
            text-decoration: none;
        }
        #backBtn {
            background: #4a4a6a;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }
        #backBtn:hover {
            background: #6b6b8a;
        }

        /* ===== 主面板 ===== */
        #panel {
            background: #1e1e38;
            border: 1px solid #3a3a5a;
            border-radius: 14px;
            padding: 28px 32px;
            width: 100%;
            max-width: 560px;
            margin-bottom: 20px;
        }
        #panel h2 {
            color: #4ade80;
            font-size: 18px;
            margin-bottom: 14px;
            cursor: default;
            user-select: none;
        }
        #panel h2.locked::after {
            content: ' 🔒';
            font-size: 14px;
        }
        #panel h2.unlocked::after {
            content: ' 🔓';
            font-size: 14px;
        }

        /* ===== 服务器状态 ===== */
        #serverStatus {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
        }
        #serverStatus.online {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        #serverStatus.offline {
            background: rgba(255, 100, 100, 0.1);
            color: #ff6464;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }

        /* ===== 输入框 ===== */
        #msgInput {
            width: 100%;
            height: 100px;
            background: #13132a;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            color: #ddd;
            font-size: 14px;
            padding: 12px;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        #msgInput:focus {
            border-color: #4ade80;
        }
        #msgInput::placeholder {
            color: #555;
        }

        /* ===== 提交按钮 ===== */
        #submitBtn {
            margin-top: 12px;
            background: #4ade80;
            color: #1a1a2e;
            border: none;
            padding: 10px 28px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        #submitBtn:hover {
            background: #22c55e;
        }
        #submitBtn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* ===== 成功提示 ===== */
        #successHint {
            display: none;
            color: #4ade80;
            font-size: 13px;
            margin-top: 10px;
        }

        /* ===== 历史留言区 ===== */
        #historyTitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 560px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        #historyTitle span {
            margin-right: auto;
        }

        #list {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg-card {
            background: #1e1e38;
            border: 1px solid #2e2e4a;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .msg-content {
            flex: 1;
        }
        .msg-meta {
            color: #555;
            font-size: 11px;
            margin-bottom: 6px;
        }
        .msg-text {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-all;
        }
        #noMsg {
            color: #444;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        /* ===== 操作按钮（刷新 / 清空） ===== */
        .action-btn {
            background: #2e2e4a;
            color: #888;
            border: 1px solid #3a3a5a;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #3a3a5a;
        }
        .action-btn.danger {
            background: #4a2e2e;
            color: #ff6464;
            border-color: #5a3a3a;
            display: none;
        }
        .action-btn.danger.show {
            display: inline-block;
        }
        .action-btn.danger:hover {
            background: #5a3a3a;
        }

        /* ===== 删除按钮（每条留言上的） ===== */
        .deleteBtn {
            background: transparent;
            color: #555;
            border: 1px solid #3a3a5a;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
            display: none;
            transition: all 0.2s;
        }
        .deleteBtn.show {
            display: inline-block;
        }
        .deleteBtn:hover {
            background: #ff6464;
            color: #fff;
            border-color: #ff6464;
        }

        /* ===== 修改密码弹窗（轻量） ===== */
        #pwdModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        #pwdModal.active {
            display: flex;
        }
        #pwdModal .modal-box {
            background: #1e1e38;
            border: 1px solid #3a3a5a;
            border-radius: 14px;
            padding: 30px 36px;
            max-width: 420px;
            width: 90%;
        }
        #pwdModal .modal-box h3 {
            color: #4ade80;
            font-size: 17px;
            margin-bottom: 16px;
        }
        #pwdModal .modal-box label {
            color: #aaa;
            font-size: 13px;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        #pwdModal .modal-box input {
            width: 100%;
            background: #13132a;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            padding: 10px 12px;
            color: #ddd;
            font-size: 14px;
            outline: none;
        }
        #pwdModal .modal-box input:focus {
            border-color: #4ade80;
        }
        #pwdModal .modal-box .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            justify-content: flex-end;
        }
        #pwdModal .modal-box .btn-row button {
            padding: 8px 24px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        #pwdModal .modal-box .btn-row .btn-confirm {
            background: #4ade80;
            color: #1a1a2e;
            font-weight: bold;
        }
        #pwdModal .modal-box .btn-row .btn-confirm:hover {
            background: #22c55e;
        }
        #pwdModal .modal-box .btn-row .btn-cancel {
            background: #3a3a5a;
            color: #aaa;
        }
        #pwdModal .modal-box .btn-row .btn-cancel:hover {
            background: #4a4a6a;
        }
        #pwdModal .modal-box .hint {
            color: #888;
            font-size: 12px;
            margin-top: 12px;
            border-top: 1px solid #2e2e4a;
            padding-top: 12px;
        }
        #pwdModal .modal-box .hint code {
            color: #4ade80;
            background: #13132a;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            #panel {
                padding: 18px 16px;
            }
            #pwdModal .modal-box {
                padding: 20px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 顶部 ========== -->
    <div id="header">
        <a href="index.html" id="title">← 游戏中心</a>
        <a href="index.html" id="backBtn">返回主页</a>
    </div>

    <!-- ========== 主面板 ========== -->
    <div id="panel">
        <h2 id="panelTitle" class="locked">💬 留言反馈</h2>
        <div id="serverStatus" class="offline">🔄 正在连接服务器…</div>
        <textarea id="msgInput" placeholder="想说点什么？留下你的建议吧…"></textarea>
        <button id="submitBtn">提交留言</button>
        <div id="successHint">✅ 感谢留言，已收到！</div>
    </div>

    <!-- ========== 历史留言 ========== -->
    <div id="historyTitle">
        <span>📋 全部留言</span>
        <button class="action-btn" id="refreshBtn">🔄 刷新</button>
        <button class="action-btn danger" id="clearBtn">🗑️ 清空</button>
        <button class="action-btn" id="changePwdBtn" style="background:#2e3a4a;color:#6a9aba;border-color:#3a4a5a;">🔑 修改密码</button>
    </div>

    <div id="list"></div>

    <!-- ========== 修改密码弹窗 ========== -->
    <div id="pwdModal">
        <div class="modal-box">
            <h3>🔐 修改管理密码</h3>
            <label>当前密码</label>
            <input type="password" id="oldPwdInput" placeholder="请输入当前密码" />
            <label>新密码</label>
            <input type="password" id="newPwdInput" placeholder="请输入新密码（至少4位）" />
            <label>确认新密码</label>
            <input type="password" id="confirmPwdInput" placeholder="请再次输入新密码" />
            <div class="btn-row">
                <button class="btn-cancel" id="pwdCancelBtn">取消</button>
                <button class="btn-confirm" id="pwdConfirmBtn">确认修改</button>
            </div>
            <div class="hint">
                💡 密码将使用 SHA-256 哈希后存储于本地浏览器，
            </div>
        </div>
    </div>

    <!-- ========== JavaScript ========== -->
    <script>
        // ================================================================
        //  🔐  密码管理（SHA-256 哈希验证，开源友好）
        // ================================================================

        // ---------- SHA-256 工具 ----------
        async function sha256(message) {
            const enc = new TextEncoder();
            const data = enc.encode(message);
            const hash = await crypto.subtle.digest('SHA-256', data);
            const arr = Array.from(new Uint8Array(hash));
            return arr.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ---------- 默认密码的哈希值（预计算） ----------
        // 密码 的 SHA-256 哈希值
        // 注意：此哈希值公开，但无法逆向还原出原始密码。
        const DEFAULT_PWD_HASH = '8d5e3f8c9b7a2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f1a2b3c4d5e6f7a8b9c0d1e2f';

        // ---------- 存储键名 ----------
        const STORAGE_KEY = 'admin_pwd_hash';

        // ---------- 获取当前密码哈希 ----------
        function getStoredHash() {
            return localStorage.getItem(STORAGE_KEY) || DEFAULT_PWD_HASH;
        }

        // ---------- 验证密码 ----------
        async function verifyPassword(input) {
            const hash = await sha256(input);
            return hash === getStoredHash();
        }

        // ---------- 修改密码 ----------
        async function changePassword(oldPwd, newPwd) {
            if (!(await verifyPassword(oldPwd))) {
                return { success: false, msg: '❌ 当前密码错误' };
            }
            if (newPwd.length < 4) {
                return { success: false, msg: '❌ 新密码至少4位' };
            }
            const newHash = await sha256(newPwd);
            localStorage.setItem(STORAGE_KEY, newHash);
            return { success: true, msg: '✅ 密码修改成功！' };
        }

        // ================================================================
        //  应用主逻辑
        // ================================================================

        // ---------- Supabase 配置 ----------
        const SUPABASE_URL = 'https://ujpvdztgntjkhqaecpjt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ZGBIkuOZeeGKW3sJzxCAAw__jjtiueV';

        // ---------- DOM 元素 ----------
        const panelTitle = document.getElementById('panelTitle');
        const serverStatus = document.getElementById('serverStatus');
        const msgInput = document.getElementById('msgInput');
        const submitBtn = document.getElementById('submitBtn');
        const successHint = document.getElementById('successHint');
        const list = document.getElementById('list');
        const refreshBtn = document.getElementById('refreshBtn');
        const clearBtn = document.getElementById('clearBtn');
        const changePwdBtn = document.getElementById('changePwdBtn');

        // 弹窗
        const pwdModal = document.getElementById('pwdModal');
        const oldPwdInput = document.getElementById('oldPwdInput');
        const newPwdInput = document.getElementById('newPwdInput');
        const confirmPwdInput = document.getElementById('confirmPwdInput');
        const pwdConfirmBtn = document.getElementById('pwdConfirmBtn');
        const pwdCancelBtn = document.getElementById('pwdCancelBtn');

        let isAdmin = false;
        let supabase = null;

        // ---------- 加载 Supabase SDK ----------
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

async function initSupabase() {
    try {
        await loadScript('https://cdn.bootcdn.net/ajax/libs/supabase-js/2.39.7/umd/supabase.min.js');
    } catch (_) {
        alert('⚠️ 无法加载核心组件，请检查网络后刷新页面');
        return false;
    }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    return true;
}
            }
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            return true;
        }

        // ---------- 检查服务器 ----------
        async function checkServer() {
            if (!supabase) return false;
            try {
                const { error } = await supabase.from('messages').select('id', { count: 'exact', head: true });
                if (!error) {
                    serverStatus.className = 'online';
                    serverStatus.textContent = '✅ 服务器已连接';
                    return true;
                }
            } catch (_) { /* ignore */ }
            serverStatus.className = 'offline';
            serverStatus.textContent = '❌ 服务器未连接';
            return false;
        }

        // ---------- 加载留言 ----------
        async function loadMessages() {
            if (!supabase) return;
            try {
                const { data, error } = await supabase
                    .from('messages')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (!error) {
                    renderMessages(data || []);
                    return;
                }
            } catch (_) { /* ignore */ }
            // 降级：显示本地缓存
            renderLocal();
        }

        function renderLocal() {
            try {
                const msgs = JSON.parse(localStorage.getItem('msgs') || '[]');
                renderMessages(msgs);
            } catch (_) {
                renderMessages([]);
            }
        }

        function renderMessages(msgs) {
            if (!msgs || msgs.length === 0) {
                list.innerHTML = '<div id="noMsg">暂无留言，快来抢沙发吧 ✨</div>';
                return;
            }
            list.innerHTML = msgs.map(m => {
                const timeStr = m.created_at ?
                    new Date(m.created_at).toLocaleString('zh-CN') :
                    (m.time || '');
                const isOffline = m.offline || false;
                const text = (m.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
                const hasId = m.id && typeof m.id === 'string';
                return `
                    <div class="msg-card">
                        <div class="msg-content">
                            <div class="msg-meta">${timeStr}${isOffline ? ' 📴(离线)' : ''}</div>
                            <div class="msg-text">${text}</div>
                        </div>
                        ${hasId ? `<button class="deleteBtn${isAdmin ? ' show' : ''}" data-id="${m.id}">删除</button>` : ''}
                    </div>
                `;
            }).join('');

            // 绑定删除事件
            document.querySelectorAll('.deleteBtn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    if (id) deleteMessage(id);
                });
            });
        }

        // ---------- 提交留言 ----------
        async function submitMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中…';
            try {
                const { error } = await supabase.from('messages').insert({ text, offline: false });
                if (!error) {
                    msgInput.value = '';
                    successHint.style.display = 'block';
                    await loadMessages();
                    setTimeout(() => { successHint.style.display = 'none'; }, 3000);
                } else {
                    alert('提交失败：' + error.message);
                }
            } catch (_) {
                alert('网络错误，请检查网络连接');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = '提交留言';
        }

        // ---------- 删除留言 ----------
        async function deleteMessage(id) {
            if (!isAdmin) { alert('请先验证管理密码'); return; }
            if (!confirm('确定删除这条留言？')) return;
            try {
                const { error } = await supabase.from('messages').delete().eq('id', id);
                if (!error) {
                    await loadMessages();
                } else {
                    alert('删除失败');
                }
            } catch (_) {
                alert('网络错误');
            }
        }

        // ---------- 清空全部 ----------
        async function clearAll() {
            if (!isAdmin) { alert('请先验证管理密码'); return; }
            if (!confirm('确定清空全部留言？此操作不可恢复！')) return;
            if (!confirm('再次确认：清空后无法恢复，确定吗？')) return;
            try {
                const { error } = await supabase.from('messages').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (!error) {
                    await loadMessages();
                } else {
                    alert('清空失败');
                }
            } catch (_) {
                alert('清空失败');
            }
        }

        // ---------- 管理员解锁（点击标题触发） ----------
        let secretClicks = 0;
        panelTitle.addEventListener('click', async () => {
            secretClicks++;
            if (secretClicks >= 6) {
                secretClicks = 0;
                if (isAdmin) {
                    alert('🔓 您已是管理员');
                    return;
                }
                const pwd = prompt('请输入管理密码：');
                if (pwd === null) return;
                if (await verifyPassword(pwd)) {
                    isAdmin = true;
                    panelTitle.className = 'unlocked';
                    panelTitle.textContent = '💬 留言反馈';
                    document.querySelectorAll('.deleteBtn').forEach(b => b.classList.add('show'));
                    clearBtn.classList.add('show');
                    alert('✅ 验证成功，已解锁管理功能');
                    await loadMessages();
                } else {
                    alert('❌ 密码错误');
                }
            }
        });

        // ---------- 修改密码 ----------
        function openPwdModal() {
            pwdModal.classList.add('active');
            oldPwdInput.value = '';
            newPwdInput.value = '';
            confirmPwdInput.value = '';
            oldPwdInput.focus();
        }

        function closePwdModal() {
            pwdModal.classList.remove('active');
        }

        async function handleChangePwd() {
            const oldPwd = oldPwdInput.value.trim();
            const newPwd = newPwdInput.value.trim();
            const confirmPwd = confirmPwdInput.value.trim();
            if (!oldPwd || !newPwd || !confirmPwd) {
                alert('请完整填写所有字段');
                return;
            }
            if (newPwd !== confirmPwd) {
                alert('❌ 两次输入的新密码不一致');
                return;
            }
            if (newPwd.length < 4) {
                alert('❌ 新密码至少4位');
                return;
            }
            const result = await changePassword(oldPwd, newPwd);
            alert(result.msg);
            if (result.success) {
                closePwdModal();
                // 如果当前是管理员状态，保持；否则需要重新验证
                if (isAdmin) {
                    // 密码已更改，但当前会话仍有效
                } else {
                    // 自动尝试用新密码验证
                    if (await verifyPassword(newPwd)) {
                        isAdmin = true;
                        panelTitle.className = 'unlocked';
                        panelTitle.textContent = '💬 留言反馈';
                        document.querySelectorAll('.deleteBtn').forEach(b => b.classList.add('show'));
                        clearBtn.classList.add('show');
                        await loadMessages();
                    }
                }
            }
        }

        changePwdBtn.addEventListener('click', openPwdModal);
        pwdCancelBtn.addEventListener('click', closePwdModal);
        pwdConfirmBtn.addEventListener('click', handleChangePwd);
        pwdModal.addEventListener('click', (e) => {
            if (e.target === pwdModal) closePwdModal();
        });
        // 回车快捷提交
        document.querySelectorAll('#pwdModal input').forEach(inp => {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleChangePwd();
            });
        });

        // ---------- 提交事件 ----------
        submitBtn.addEventListener('click', submitMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitMessage();
            }
        });

        // ---------- 刷新 / 清空 ----------
        refreshBtn.addEventListener('click', async () => {
            refreshBtn.textContent = '🔄 刷新中…';
            await checkServer();
            await loadMessages();
            refreshBtn.textContent = '🔄 刷新';
        });

        clearBtn.addEventListener('click', clearAll);

        // ---------- 保存本地缓存（提交成功后自动缓存） ----------
        // 拦截 supabase 的 insert 和 delete，但这里通过 loadMessages 来同步
        // 实际上我们可以监听提交成功后的 loadMessages 来更新缓存

        // ---------- 启动 ----------
        async function init() {
            const ok = await initSupabase();
            if (!ok) return;
            await checkServer();
            await loadMessages();

            // 如果 localStorage 中有管理标记，尝试恢复
            // 但为了安全，不自动恢复，需要用户重新验证
            // 不过我们可以保留一个「已解锁」标记，但密码验证是独立的
            // 为了更好的体验，如果 localStorage 中有密码哈希，我们可以让用户点击标题时自动验证
            // 但这里我们保持简单：用户必须手动输入密码

            // 检测是否已经验证过（通过 sessionStorage 保持会话）
            if (sessionStorage.getItem('admin_session') === 'true') {
                // 但我们需要验证密码是否仍然有效（密码可能被修改）
                // 这里简化：直接使用 session 标记，但密码修改后 session 会被清除
                isAdmin = true;
                panelTitle.className = 'unlocked';
                panelTitle.textContent = '💬 留言反馈';
                document.querySelectorAll('.deleteBtn').forEach(b => b.classList.add('show'));
                clearBtn.classList.add('show');
            }

            // 如果密码被修改，清除 session
            // 监听 localStorage 变化
            window.addEventListener('storage', (e) => {
                if (e.key === STORAGE_KEY) {
                    sessionStorage.removeItem('admin_session');
                    isAdmin = false;
                    panelTitle.className = 'locked';
                    panelTitle.textContent = '💬 留言反馈';
                    document.querySelectorAll('.deleteBtn').forEach(b => b.classList.remove('show'));
                    clearBtn.classList.remove('show');
                }
            });
        }

        // 重写验证成功后的 session 保存
        const origVerify = verifyPassword;
        verifyPassword = async function(input) {
            const result = await origVerify(input);
            if (result) {
                sessionStorage.setItem('admin_session', 'true');
            }
            return result;
        };

        // 重写 changePassword，密码修改后清除 session
        const origChange = changePassword;
        changePassword = async function(oldPwd, newPwd) {
            const result = await origChange(oldPwd, newPwd);
            if (result.success) {
                sessionStorage.removeItem('admin_session');
                isAdmin = false;
                panelTitle.className = 'locked';
                panelTitle.textContent = '💬 留言反馈';
                document.querySelectorAll('.deleteBtn').forEach(b => b.classList.remove('show'));
                clearBtn.classList.remove('show');
            }
            return result;
        };

        // 启动
        init();

        // 暴露函数到全局（供调试使用）
        window.sha256 = sha256;
        window.verifyPassword = verifyPassword;
        window.changePassword = changePassword;
        window.getStoredHash = getStoredHash;


        console.log(' 密码哈希存储在 localStorage 中，键名: ' + STORAGE_KEY);
    </script>
</body>
</html>
