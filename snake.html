<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(145deg, #0b0b1a 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 16px;
        }

        .game-container {
            background: #0f0f23;
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        #gameWrapper {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 0 2px #2a2a4a;
        }

        canvas {
            display: block;
            background: #0f0f23;
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            max-width: 600px;
            margin-bottom: 16px;
            gap: 20px;
            flex-wrap: wrap;
            background: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 60px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .score-box, .lives-box {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-box span:first-child, .lives-box span:first-child {
            color: #aaa;
            margin-right: 8px;
        }

        #score {
            color: #4ade80;
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 0 0 5px #22c55e80;
        }

        #lives {
            color: #f87171;
            font-size: 1.6rem;
            letter-spacing: 4px;
        }

        .button-bar {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-btn {
            background: #2d2d44;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 28px;
            border-radius: 48px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-family: inherit;
        }

        .game-btn:active {
            transform: scale(0.96);
        }

        #startBtn {
            background: #4ade80;
            color: #0a0a1a;
            box-shadow: 0 0 12px #4ade8066;
        }

        #resetBtn {
            background: #3b3b5c;
            border: 1px solid #6b6b8a;
        }

        .hint-text {
            color: #7e7e9e;
            margin-top: 18px;
            font-size: 0.8rem;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 6px 14px;
            border-radius: 60px;
        }

        .back-link {
            background: #2a2a48;
            color: #bbbbff;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover {
            background: #3e3e66;
            color: white;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }
        .game-title {
            color: #4ade80;
            font-size: 1.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #22c55e;
        }

        @media (max-width: 480px) {
            .game-btn {
                padding: 6px 20px;
                font-size: 0.9rem;
            }
            .info-panel {
                padding: 8px 20px;
            }
            #score {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="header-row">
    <div class="game-title">🐍 贪吃蛇</div>
    <a href="index.html" class="back-link" id="backBtn">← 返回首页</a>
</div>

<div class="info-panel">
    <div class="score-box"><span> 得分</span> <span id="score">0</span></div>
    <div class="lives-box"><span> 生命</span> <span id="lives">❤️❤️❤️</span></div>
</div>

<div class="game-container">
    <div id="gameWrapper">
        <canvas id="gameCanvas"></canvas>
    </div>
</div>

<div class="button-bar">
    <button class="game-btn" id="startBtn">▶ 开始游戏</button>
    <button class="game-btn" id="resetBtn">🔄 新的一局</button>
</div>

<div class="hint-text">
    🖱️ 键盘方向键 或 在游戏区域滑动手指 → 控制小蛇
</div>

<script>
    (function(){
        // ---------- 游戏配置 ----------
        const GRID_SIZE = 20;          // 每个格子像素
        const GRID_COLS = 30;
        const GRID_ROWS = 25;
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        canvas.width = GRID_COLS * GRID_SIZE;
        canvas.height = GRID_ROWS * GRID_SIZE;
        
        // 游戏状态
        let snake = [];
        let food = { x: 15, y: 12 };
        let dx = 1, dy = 0;
        let nextDx = 1, nextDy = 0;
        let score = 0;
        let lives = 3;
        let isRunning = false;
        let gameInterval = null;
        let isGameOverFlag = false;
        
        function updateLivesDisplay() {
            let hearts = '';
            for(let i=0; i<lives; i++) hearts += '❤️';
            if(lives <= 0) hearts = '💀💀💀';
            livesEl.textContent = hearts;
        }
        
        function updateScoreUI() {
            scoreEl.textContent = score;
        }
        
        // ---------- 精致网格 ----------
        function drawGrid() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e1e38';
            ctx.lineWidth = 0.6;
            for (let i = 0; i <= GRID_COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= GRID_ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }
        }
        
        // 绘制小蛇 (圆润翠绿 + 灵动大眼)
        function drawSnake() {
            snake.forEach((seg, idx) => {
                const isHead = idx === 0;
                const x = seg.x * GRID_SIZE;
                const y = seg.y * GRID_SIZE;
                const radius = 5;
                ctx.fillStyle = isHead ? '#2ecc71' : '#4ade80';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2, radius);
                ctx.fill();
                if(isHead){
                    ctx.fillStyle = '#ffffff';
                    const eyeSize = 3;
                    if(dx === 1) { // 右
                        ctx.fillRect(x + GRID_SIZE - 7, y + 5, eyeSize, eyeSize);
                        ctx.fillRect(x + GRID_SIZE - 7, y + GRID_SIZE - 9, eyeSize, eyeSize);
                    } else if(dx === -1) { // 左
                        ctx.fillRect(x + 4, y + 5, eyeSize, eyeSize);
                        ctx.fillRect(x + 4, y + GRID_SIZE - 9, eyeSize, eyeSize);
                    } else if(dy === -1) { // 上
                        ctx.fillRect(x + 5, y + 4, eyeSize, eyeSize);
                        ctx.fillRect(x + GRID_SIZE - 9, y + 4, eyeSize, eyeSize);
                    } else { // 下
                        ctx.fillRect(x + 5, y + GRID_SIZE - 8, eyeSize, eyeSize);
                        ctx.fillRect(x + GRID_SIZE - 9, y + GRID_SIZE - 8, eyeSize, eyeSize);
                    }
                    ctx.fillStyle = '#000000';
                    if(dx === 1) {
                        ctx.fillRect(x + GRID_SIZE - 8, y + 5, 2, 2);
                        ctx.fillRect(x + GRID_SIZE - 8, y + GRID_SIZE - 9, 2, 2);
                    } else if(dx === -1) {
                        ctx.fillRect(x + 5, y + 5, 2, 2);
                        ctx.fillRect(x + 5, y + GRID_SIZE - 9, 2, 2);
                    } else if(dy === -1) {
                        ctx.fillRect(x + 6, y + 4, 2, 2);
                        ctx.fillRect(x + GRID_SIZE - 9, y + 4, 2, 2);
                    } else {
                        ctx.fillRect(x + 6, y + GRID_SIZE - 8, 2, 2);
                        ctx.fillRect(x + GRID_SIZE - 9, y + GRID_SIZE - 8, 2, 2);
                    }
                }
            });
        }
        
        // ---------- 超写实苹果绘制 (红润光泽、立体果梗、鲜嫩叶片) ----------
        function drawApple(px, py) {
            const cx = px * GRID_SIZE + GRID_SIZE/2;
            const cy = py * GRID_SIZE + GRID_SIZE/2;
            const radius = GRID_SIZE/2 - 3;   // 大约7px半径，足够精致
            
            // 苹果主体：两层径向渐变，立体感十足
            const gradMain = ctx.createRadialGradient(cx-3, cy-2, 2, cx, cy, radius);
            gradMain.addColorStop(0, '#ff5e5e');
            gradMain.addColorStop(0.5, '#e33b3b');
            gradMain.addColorStop(1, '#aa2e2e');
            ctx.fillStyle = gradMain;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI*2);
            ctx.fill();
            
            // 苹果底部轻微凹陷阴影
            ctx.fillStyle = '#7a1f1f';
            ctx.beginPath();
            ctx.ellipse(cx, cy+2, radius*0.3, radius*0.12, 0, 0, Math.PI*2);
            ctx.fill();
            
            // 右上角强高光
            ctx.fillStyle = '#ffb7b7';
            ctx.beginPath();
            ctx.ellipse(cx-2, cy-3, 2.5, 1.8, 0, 0, Math.PI*2);
            ctx.fill();
            // 辅助小高光
            ctx.fillStyle = '#ffe0e0';
            ctx.beginPath();
            ctx.ellipse(cx-4, cy-4, 1.5, 1.2, 0, 0, Math.PI*2);
            ctx.fill();
            
            // 苹果梗 (弯曲棕色)
            ctx.fillStyle = '#6b3e1a';
            ctx.beginPath();
            ctx.moveTo(cx-1, cy-radius);
            ctx.quadraticCurveTo(cx+1, cy-radius-3, cx, cy-radius-5);
            ctx.lineTo(cx-2, cy-radius-4);
            ctx.fill();
            ctx.fillStyle = '#8b5a2b';
            ctx.beginPath();
            ctx.moveTo(cx, cy-radius-1);
            ctx.quadraticCurveTo(cx+2, cy-radius-4, cx+1, cy-radius-6);
            ctx.lineTo(cx-1, cy-radius-5);
            ctx.fill();
            
            // 绿叶 (两片，带叶脉)
            ctx.fillStyle = '#6fbf4c';
            ctx.beginPath();
            ctx.moveTo(cx+2, cy-radius-2);
            ctx.quadraticCurveTo(cx+7, cy-radius-7, cx+3, cy-radius-6);
            ctx.quadraticCurveTo(cx+4, cy-radius-4, cx+2, cy-radius-2);
            ctx.fill();
            ctx.fillStyle = '#5aa63b';
            ctx.beginPath();
            ctx.moveTo(cx-2, cy-radius-2);
            ctx.quadraticCurveTo(cx-6, cy-radius-6, cx-3, cy-radius-6);
            ctx.quadraticCurveTo(cx-2, cy-radius-4, cx-2, cy-radius-2);
            ctx.fill();
            
            // 叶脉细线
            ctx.beginPath();
            ctx.strokeStyle = '#438a2b';
            ctx.lineWidth = 1;
            ctx.moveTo(cx+2, cy-radius-3);
            ctx.lineTo(cx+5, cy-radius-6);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx-2, cy-radius-3);
            ctx.lineTo(cx-5, cy-radius-6);
            ctx.stroke();
            
            // 轻微环境反光 (苹果底部微光)
            ctx.fillStyle = '#ff8c8c66';
            ctx.beginPath();
            ctx.ellipse(cx+2, cy+3, 2, 1.2, 0, 0, Math.PI*2);
            ctx.fill();
        }
        
        function drawFood() {
            drawApple(food.x, food.y);
        }
        
        // roundRect 工具 (保持兼容)
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.moveTo(x+r, y);
                this.lineTo(x+w-r, y);
                this.quadraticCurveTo(x+w, y, x+w, y+r);
                this.lineTo(x+w, y+h-r);
                this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
                this.lineTo(x+r, y+h);
                this.quadraticCurveTo(x, y+h, x, y+h-r);
                this.lineTo(x, y+r);
                this.quadraticCurveTo(x, y, x+r, y);
                return this;
            };
        }
        
        // 生成食物 (避开蛇身)
        function spawnFood() {
            const maxAttempts = 3000;
            for(let i=0; i<maxAttempts; i++){
                const randX = Math.floor(Math.random() * GRID_COLS);
                const randY = Math.floor(Math.random() * GRID_ROWS);
                if(!snake.some(segment => segment.x === randX && segment.y === randY)){
                    food = { x: randX, y: randY };
                    return true;
                }
            }
            for(let y=0; y<GRID_ROWS; y++){
                for(let x=0; x<GRID_COLS; x++){
                    if(!snake.some(s => s.x === x && s.y === y)){
                        food = { x, y };
                        return true;
                    }
                }
            }
            return false; // 全满胜利
        }
        
        function resetSnakePosition() {
            const centerX = Math.floor(GRID_COLS / 2);
            const centerY = Math.floor(GRID_ROWS / 2);
            snake = [
                { x: centerX, y: centerY },
                { x: centerX - 1, y: centerY },
                { x: centerX - 2, y: centerY }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
        }
        
        function fullGameReset() {
            if(gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            isRunning = false;
            isGameOverFlag = false;
            score = 0;
            lives = 3;
            updateScoreUI();
            updateLivesDisplay();
            resetSnakePosition();
            if(!spawnFood()){
                gameWin();
                return;
            }
            drawGrid();
            drawFood();
            drawSnake();
            startBtn.textContent = '▶ 开始游戏';
            startBtn.disabled = false;
        }
        
        function gameWin() {
            if(gameInterval){
                clearInterval(gameInterval);
                gameInterval = null;
            }
            isRunning = false;
            isGameOverFlag = true;
            drawGrid();
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 28px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 0;
            ctx.fillText('🏆 完美通关!', canvas.width/2, canvas.height/2 - 20);
            ctx.font = '18px system-ui';
            ctx.fillStyle = '#a0f0a0';
            ctx.fillText(`最终得分: ${score}  ✨`, canvas.width/2, canvas.height/2 + 25);
            startBtn.disabled = false;
            startBtn.textContent = '▶ 开始游戏';
        }
        
        function loseLife() {
            if(!isRunning) return;
            lives--;
            updateLivesDisplay();
            
            if(lives <= 0) {
                gameOver();
                return;
            }
            
            resetSnakePosition();
            if(!spawnFood()){
                if(snake.length >= GRID_COLS * GRID_ROWS){
                    gameWin();
                    return;
                }
                for(let y=0; y<GRID_ROWS; y++){
                    for(let x=0; x<GRID_COLS; x++){
                        if(!snake.some(s => s.x === x && s.y === y)){
                            food = { x, y };
                            break;
                        }
                    }
                }
            }
            nextDx = dx;
            nextDy = dy;
            drawGrid();
            drawFood();
            drawSnake();
        }
        
        function gameOver() {
            if(gameInterval){
                clearInterval(gameInterval);
                gameInterval = null;
            }
            isRunning = false;
            isGameOverFlag = true;
            drawGrid();
            ctx.fillStyle = '#f87171';
            ctx.font = 'bold 32px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('💀 GAME OVER', canvas.width/2, canvas.height/2 - 20);
            ctx.font = '20px system-ui';
            ctx.fillStyle = '#ddd';
            ctx.fillText(`得分: ${score}`, canvas.width/2, canvas.height/2 + 25);
            startBtn.disabled = false;
            startBtn.textContent = '▶ 开始游戏';
        }
        
        function updateGame() {
            if(!isRunning) return;
            
            let newDx = nextDx, newDy = nextDy;
            if ((newDx === -dx && newDy === -dy) || (newDx === dx && newDy === dy)) {
                newDx = dx;
                newDy = dy;
            }
            dx = newDx;
            dy = newDy;
            
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            
            if (head.x < 0 || head.x >= GRID_COLS || head.y < 0 || head.y >= GRID_ROWS) {
                loseLife();
                return;
            }
            
            let selfCollision = false;
            for(let i=0; i<snake.length; i++){
                if(snake[i].x === head.x && snake[i].y === head.y){
                    selfCollision = true;
                    break;
                }
            }
            if(selfCollision){
                loseLife();
                return;
            }
            
            snake.unshift(head);
            
            const ateFood = (head.x === food.x && head.y === food.y);
            if(ateFood) {
                score += 10;
                updateScoreUI();
                const success = spawnFood();
                if(!success){
                    gameWin();
                    return;
                }
                if(snake.length === GRID_COLS * GRID_ROWS){
                    gameWin();
                    return;
                }
            } else {
                snake.pop();
            }
        }
        
        function renderGame() {
            drawGrid();
            drawFood();
            drawSnake();
        }
        
        function gameLoop() {
            if(!isRunning) return;
            updateGame();
            renderGame();
            if(!isRunning && !gameInterval){
                return;
            }
        }
        
        function startGame() {
            if(isRunning) return;
            if(gameInterval){
                clearInterval(gameInterval);
                gameInterval = null;
            }
            fullGameReset();
            isRunning = true;
            isGameOverFlag = false;
            startBtn.disabled = true;
            startBtn.textContent = '🎮 游戏中...';
            gameInterval = setInterval(() => {
                gameLoop();
            }, 140);
        }
        
        function newGame() {
            if(gameInterval){
                clearInterval(gameInterval);
                gameInterval = null;
            }
            isRunning = false;
            fullGameReset();
            startGame();
        }
        
        function setDirection(newDx, newDy) {
            if(!isRunning) return;
            if ((newDx === -dx && newDy === -dy)) {
                return;
            }
            nextDx = newDx;
            nextDy = newDy;
        }
        
        // ---------- 移动端触摸滑动 ----------
        let touchStart = null;
        function handleTouchStart(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            touchStart = {
                x: touch.clientX - rect.left,
                y: touch.clientY - rect.top,
                time: Date.now()
            };
        }
        function handleTouchEnd(e) {
            if(!touchStart || !isRunning) {
                touchStart = null;
                return;
            }
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const endX = e.changedTouches[0].clientX - rect.left;
            const endY = e.changedTouches[0].clientY - rect.top;
            const deltaX = endX - touchStart.x;
            const deltaY = endY - touchStart.y;
            const absX = Math.abs(deltaX);
            const absY = Math.abs(deltaY);
            if(Math.max(absX, absY) < 12) {
                touchStart = null;
                return;
            }
            if(absX > absY) {
                if(deltaX > 0) setDirection(1, 0);
                else setDirection(-1, 0);
            } else {
                if(deltaY > 0) setDirection(0, 1);
                else setDirection(0, -1);
            }
            touchStart = null;
        }
        
        function handleKeyDown(e) {
            const key = e.key;
            let newDx = 0, newDy = 0;
            if(key === 'ArrowUp') { newDx = 0; newDy = -1; }
            else if(key === 'ArrowDown') { newDx = 0; newDy = 1; }
            else if(key === 'ArrowLeft') { newDx = -1; newDy = 0; }
            else if(key === 'ArrowRight') { newDx = 1; newDy = 0; }
            else return;
            
            e.preventDefault();
            if(!isRunning) return;
            setDirection(newDx, newDy);
        }
        
        function initialDraw() {
            drawGrid();
            resetSnakePosition();
            spawnFood();
            drawSnake();
            drawFood();
            ctx.fillStyle = '#6c6c8e';
            ctx.font = 'bold 22px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('点击「开始游戏」', canvas.width/2, canvas.height/2 - 10);
            ctx.font = '14px system-ui';
            ctx.fillStyle = '#aaaacc';
            ctx.fillText('键盘方向键 / 滑动屏幕控制', canvas.width/2, canvas.height/2 + 25);
        }
        
        // 事件绑定
        window.addEventListener('load', () => {
            initialDraw();
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', () => {
                if(gameInterval) clearInterval(gameInterval);
                isRunning = false;
                newGame();
            });
            document.addEventListener('keydown', handleKeyDown);
            canvas.addEventListener('touchstart', handleTouchStart, {passive: false});
            canvas.addEventListener('touchend', handleTouchEnd);
            canvas.addEventListener('touchcancel', handleTouchEnd);
            canvas.addEventListener('touchmove', (e) => {
                if(touchStart) e.preventDefault();
            }, {passive: false});
        });
    })();
</script>
</body>
</html>
